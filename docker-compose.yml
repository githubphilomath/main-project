version: '3.8'

# Root-level docker-compose for orchestrating frontend and backend
# For backend-only development, use: docker-compose -f backend/docker-compose.yml up

services:
  # Backend services (delegated to backend docker-compose)
  backend:
    extends:
      file: backend/docker-compose.yml
      service: api

  postgres:
    extends:
      file: backend/docker-compose.yml
      service: postgres

  chroma:
    extends:
      file: backend/docker-compose.yml
      service: chroma

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agent_platform_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1

volumes:
  postgres_data:
  chroma_data:

