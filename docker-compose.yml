# Root-level docker-compose for full-stack live preview
# Start: docker-compose up -d
# Access: http://localhost:3000 (frontend), http://localhost:8000 (API direct)
#
# For backend-only: docker-compose -f backend/docker-compose.yml up

services:
  # Backend services (delegated to backend docker-compose)
  backend:
    extends:
      file: backend/docker-compose.yml
      service: api

  postgres:
    extends:
      file: backend/docker-compose.yml
      service: postgres

  chroma:
    extends:
      file: backend/docker-compose.yml
      service: chroma

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
    container_name: agent_platform_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  chroma_data:

